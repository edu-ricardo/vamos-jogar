# Teste local da stack em containers, na mesma montagem do Umbrel (nginx + API + PocketBase).
# Uso: docker compose up --build   →   http://localhost:3080
# Login Google opcional: GOOGLE_CLIENT_ID e GOOGLE_CLIENT_SECRET no ambiente.
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '3080:80'
    depends_on:
      - api
      - pocketbase

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: apps/api/.env
        required: false
    environment:
      PB_URL: http://pocketbase:8090
      PB_SUPERUSER_EMAIL: &pb_admin_email admin@vamosjogar.local
      PB_SUPERUSER_PASSWORD: &pb_admin_password senha-local-de-teste
      FRONTEND_URL: http://localhost:3080
      # Notificações: npx web-push generate-vapid-keys
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-http://localhost:3080}
      # Admins fixos do painel /admin (e-mails separados por vírgula)
      APP_ADMIN_EMAILS: ${APP_ADMIN_EMAILS:-}
    depends_on:
      - pocketbase

  pocketbase:
    build:
      context: .
      dockerfile: apps/pocketbase/Dockerfile
    environment:
      PB_SUPERUSER_EMAIL: *pb_admin_email
      PB_SUPERUSER_PASSWORD: *pb_admin_password
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - pb_data:/pb_data

volumes:
  pb_data:
