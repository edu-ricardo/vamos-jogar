# Modelo processado pela imagem do nginx na inicialização: ${API_UPSTREAM} e ${PB_UPSTREAM}
# vêm do ambiente. No Umbrel a rede é compartilhada entre apps e nomes curtos como "api" podem
# ser de outro app, por isso lá as variáveis usam o nome completo do container.
server {
  listen 80;
  root /usr/share/nginx/html;

  # DNS do Docker, resolvido a cada requisição: o nginx sobe mesmo se a API ainda não estiver pronta
  resolver 127.0.0.11 valid=10s ipv6=off;

  # API no mesmo endereço do site: sem CORS e sem URL fixa no build
  location /api/ {
    set $api_upstream http://${API_UPSTREAM};
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Fim do login com Google: o PocketBase manda a janela para /pb/_/#/auth/oauth2-redirect-*.
  # Respondemos com uma página mínima que fecha a janela, em vez do painel de administração.
  location = /pb/_/ {
    default_type text/html;
    add_header Cache-Control "no-store";
    return 200 '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Vamos Jogar</title><p style="font-family:system-ui;text-align:center;margin-top:3em">Login concluído. Pode fechar esta janela.</p><script>window.close()</script>';
  }

  # Painel de administração do PocketBase fora da internet (acesso só por túnel SSH)
  location ^~ /pb/_/ {
    return 404;
  }

  # Rotas de administração da API do PocketBase também ficam fora: login do superusuário,
  # configurações, backups, logs, crons e edição de coleções. A API do app e a importação
  # falam com o PocketBase pela rede interna, sem passar por aqui.
  location ~ ^/pb/api/(collections/_superusers/|settings|backups|logs|crons|collections/?$|collections/[^/]+/?$) {
    return 404;
  }

  # PocketBase (dados e login) no mesmo endereço, sem o prefixo /pb
  location /pb/ {
    set $pb_upstream http://${PB_UPSTREAM};
    rewrite ^/pb/(.*)$ /$1 break;
    proxy_pass $pb_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Tempo real (SSE): o login com Google recebe a resposta por essa conexão
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 360s;
  }

  # Arquivos com hash no nome nunca mudam
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Service worker e página inicial sempre revalidados, para o PWA pegar versões novas
  location ~ ^/(sw\.js|workbox-.*\.js|index\.html)$ {
    add_header Cache-Control "no-cache";
  }

  # Rotas do React Router caem no index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
