server {
  listen 80;
  root /usr/share/nginx/html;

  # API no mesmo endereço do site: sem CORS e sem URL fixa no build
  location /api/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Arquivos com hash no nome nunca mudam
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Service worker e página inicial sempre revalidados, para o PWA pegar versões novas
  location ~ ^/(sw\.js|workbox-.*\.js|index\.html)$ {
    add_header Cache-Control "no-cache";
  }

  # Rotas do React Router caem no index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
