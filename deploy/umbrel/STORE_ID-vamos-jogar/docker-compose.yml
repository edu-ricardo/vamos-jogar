version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: STORE_ID-vamos-jogar_web_1
      APP_PORT: 80
      # O app tem login próprio; com o login do Umbrel os amigos não conseguiriam entrar
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/edu-ricardo/vamos-jogar-web:1.0.0
    restart: on-failure
    depends_on:
      - api

  api:
    image: ghcr.io/edu-ricardo/vamos-jogar-api:1.0.0
    restart: on-failure
    # Segredos ficam no Umbrel, fora da loja: ~/umbrel/app-data/STORE_ID-vamos-jogar/data/api.env
    env_file:
      - ${APP_DATA_DIR}/data/api.env
